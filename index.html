<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Касса — рабочее место продавца</title>
<style>
  :root { --red:#d0021b; --green:#1e8e3e; --blue:#1a5fb4; --bg:#1e1f24; }
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI", Arial, sans-serif; }
  body { background:var(--bg); color:#eee; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { background:var(--red); color:#fff; padding:10px 20px; display:flex; align-items:center; gap:20px; }
  header .logo { font-weight:bold; font-size:18px; letter-spacing:1px; }
  header .info { margin-left:auto; font-size:14px; opacity:.9; }

  main { flex:1; display:flex; min-height:0; }

  /* левая часть — чек */
  #receipt { flex:1.4; padding:16px; display:flex; flex-direction:column; min-width:0; }
  #scan { padding:14px; font-size:18px; border:0; border-radius:8px; outline:none; }
  .hint { font-size:12px; color:#888; margin:6px 0 10px; }
  #rows { flex:1; overflow-y:auto; }
  .row { display:grid; grid-template-columns:1fr 90px 90px 40px 40px; gap:8px;
         background:#2a2b31; border-radius:8px; padding:10px; margin-bottom:8px; align-items:center; }
  .row .nm { font-size:14px; }
  .row .sub { font-size:11px; color:#999; }
  .row .qty button { width:26px; height:26px; border:0; background:#3a3b42; color:#fff; border-radius:4px; cursor:pointer; }
  .row .price { text-align:right; font-weight:bold; }
  .row .del { color:#e05555; cursor:pointer; text-align:center; }
  #empty { color:#777; text-align:center; margin-top:40px; }

  /* правая часть — оплата */
  #pay { flex:1; background:#26272d; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .total-box { background:#000; border-radius:10px; padding:18px; text-align:center; }
  .total-box .label { font-size:13px; color:#999; }
  .total-box .sum { font-size:36px; font-weight:bold; color:#7fd57f; }
  .btn { padding:16px; border:0; border-radius:10px; font-size:17px; font-weight:bold; cursor:pointer; color:#fff; }
  .btn:active { transform:scale(.98); }
  .cash { background:var(--green); }
  .card { background:var(--blue); }
  .void { background:#444; }
  #msg { font-size:14px; min-height:20px; }
  #msg.err { color:#ff7b7b; } #msg.ok { color:#7fd57f; }

  /* чек после оплаты */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
             align-items:center; justify-content:center; z-index:50; }
  #overlay.show { display:flex; }
  #ticket { background:#fff; color:#111; width:340px; max-height:80vh; overflow-y:auto;
            padding:20px; border-radius:8px; font-family:"Courier New", monospace; font-size:13px; }
  #ticket h3 { text-align:center; margin-bottom:8px; }
  #ticket .line { display:flex; justify-content:space-between; margin:3px 0; }
  #ticket .hr { border-top:1px dashed #999; margin:8px 0; }
  #ticket .total { font-size:16px; font-weight:bold; }
  #ticket button { margin-top:14px; width:100%; padding:10px; background:var(--red); color:#fff; border:0; border-radius:6px; cursor:pointer; }

  /* журнал смены */
  #shift { position:fixed; right:-480px; top:0; width:460px; height:100%; background:#26272d;
           box-shadow:-4px 0 16px rgba(0,0,0,.4); transition:right .25s; padding:20px; z-index:40; overflow-y:auto; }
  #shift.open { right:0; }
  #shift h3 { margin-bottom:12px; }
  #shift table { width:100%; border-collapse:collapse; font-size:13px; }
  #shift td, #shift th { padding:6px; border-bottom:1px solid #3a3b42; text-align:left; }
</style>
</head>
<body>

<header>
  <div class="logo">КРАСНОБЕЛОЕ · КАССА №1</div>
  <div class="info">Смена открыта: <span id="shiftStart"></span> · Кассир: Иванова А.</div>
  <div class="info">Товаров: <span id="count">0</span> · Чеков за смену: <span id="salesCount">0</span></div>
</header>

<main>
  <div id="receipt">
    <input id="scan" placeholder="◀ Сканируйте штрихкод (или введите цифры и Enter)" autofocus>
    <div class="hint">Сканер работает как клавиатура: читает код и нажимает Enter. Можно вводить вручную.</div>
    <div id="rows"></div>
    <div id="empty">Чек пуст. Отсканируйте первый товар.</div>
  </div>

  <div id="pay">
    <div class="total-box">
      <div class="label">К ОПЛАТЕ</div>
      <div class="sum" id="total">0.00 ₽</div>
    </div>
    <div id="msg"></div>
    <label style="font-size:14px"><input type="checkbox" id="age"> Покупателю 18+ подтверждён</label>
    <button class="btn cash" onclick="pay('cash')">НАЛИЧНЫЕ</button>
    <button class="btn card" onclick="pay('card')">КАРТА</button>
    <button class="btn void" onclick="voidReceipt()">ОТМЕНИТЬ ЧЕК</button>
    <button class="btn void" onclick="toggleShift()">ЖУРНАЛ СМЕНЫ</button>
  </div>
</main>

<div id="overlay"><div id="ticket"></div></div>

<div id="shift">
  <h3>Журнал смены</h3>
  <table>
    <thead><tr><th>Чек</th><th>Время</th><th>Сумма</th><th>Оплата</th></tr></thead>
    <tbody id="shiftRows"></tbody>
  </table>
  <p id="shiftTotals" style="margin-top:12px;font-size:15px"></p>
  <button class="btn void" style="margin-top:16px" onclick="toggleShift()">ЗАКРЫТЬ ЖУРНАЛ</button>
</div>

<script>
const PRODUCTS = {
  "4600728000019": {name:"Пиво светлое 0,5 л",          price:129, alc:true},
  "4600728000026": {name:"Вино красное сухое 0,7 л",    price:599, alc:true},
  "4600700000004": {name:"Водка классическая 0,5 л",    price:549, alc:true},
  "4600338011011": {name:"Сигареты (витрина-пример)",   price:250, alc:true},
  "4600682000012": {name:"Минеральная вода 0,5 л",      price:55},
  "4600682000029": {name:"Чипсы 150 г",                 price:99},
  "4601000000001": {name:"Молоко 1 л",                  price:79},
  "4601000000018": {name:"Хлеб нарезной 400 г",         price:42},
};

let cart = {};
let shift = JSON.parse(localStorage.getItem("shift") || '{"sales":[],"start":null}');

// ограничение времени продажи алкоголя
function alcoholForbidden() {
  const h = new Date().getHours();
  return h >= 23 || h < 8;
}

document.getElementById("scan").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const bc = document.getElementById("scan").value.trim();
    document.getElementById("scan").value = "";
    if (bc) add(bc);
  }
});

function add(bc) {
  const msg = document.getElementById("msg");
  msg.className = "";
  const p = PRODUCTS[bc];
  if (!p) { msg.textContent = "✕ Штрихкод не найден: " + bc; msg.className = "err"; return; }
  if (p.alc && alcoholForbidden()) {
    msg.textContent = "✕ ПРОДАЖА АЛКОГОЛЯ ЗАПРЕЩЕНА (время 23:00–08:00)"; msg.className = "err"; return;
  }
  cart[bc] = (cart[bc] || 0) + 1;
  msg.textContent = "✓ " + p.name + " — " + p.price.toFixed(2) + " ₽"; msg.className = "ok";
  render();
}

function dec(bc) {
  if (--cart[bc] <= 0) delete cart[bc];
  render();
}
function del(bc) { delete cart[bc]; render(); }

function render() {
  const box = document.getElementById("rows");
  const codes = Object.keys(cart);
  box.innerHTML = codes.map(bc => {
    const p = PRODUCTS[bc];
    return `<div class="row">
      <div class="nm">${p.name}<div class="sub">${p.alc ? "18+ · " : ""}${p.price.toFixed(2)} ₽/шт · код ${bc}</div></div>
      <div class="qty"><button onclick="dec('${bc}')">−</button> <b>${cart[bc]}</b> <button onclick="add('${bc}')">+</button></div>
      <div class="price">${(p.price * cart[bc]).toFixed(2)} ₽</div>
      <div></div>
      <div class="del" onclick="del('${bc}')">✕</div>
    </div>`;
  }).join("");
  document.getElementById("empty").style.display = codes.length ? "none" : "block";
  const total = codes.reduce((s, bc) => s + PRODUCTS[bc].price * cart[bc], 0);
  document.getElementById("total").textContent = total.toFixed(2) + " ₽";
  document.getElementById("count").textContent = codes.reduce((s, bc) => s + cart[bc], 0);
}

function showMsg(text, cls) {
  const msg = document.getElementById("msg");
  msg.textContent = text; msg.className = cls;
}

function pay(method) {
  const codes = Object.keys(cart);
  if (!codes.length) { showMsg("✕ Чек пуст", "err"); return; }
  const hasAlc = codes.some(bc => PRODUCTS[bc].alc);
  if (hasAlc) {
    if (!document.getElementById("age").checked) {
      showMsg("✕ Подтвердите возраст покупателя (18+)", "err"); return;
    }
    if (alcoholForbidden()) { showMsg("✕ Время продажи алкоголя запрещено", "err"); return; }
  }
  const total = codes.reduce((s, bc) => s + PRODUCTS[bc].price * cart[bc], 0);
  const n = shift.sales.length + 1;

  let extra = "";
  if (method === "cash") {
    const given = prompt("Сумма от покупателя, ₽:", Math.ceil(total).toFixed(0));
    if (given === null) return;                    // отмена
    const g = parseFloat(given.replace(",", "."));
    if (isNaN(g) || g < total) { showMsg("✕ Недостаточно наличных", "err"); return; }
    extra = `<div class="line"><span>Внесено:</span><span>${g.toFixed(2)} ₽</span></div>
             <div class="line"><span><b>СДАЧА:</b></span><span><b>${(g - total).toFixed(2)} ₽</b></span></div>`;
  }

  const now = new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  const sale = {n, time:now, total, method};

  // печать чека
  document.getElementById("ticket").innerHTML = `
    <h3>ЧЕК №${n}</h3>
    <div class="line"><span>Магазин «КрасноБелое»</span><span></span></div>
    <div class="line"><span>Касса 1 · кассир Иванова А.</span><span></span></div>
    <div class="line"><span>${new Date().toLocaleString("ru-RU")}</span><span></span></div>
    <div class="hr"></div>
    ${codes.map(bc => { const p = PRODUCTS[bc];
      return `<div class="line"><span>${p.name}</span></div>
              <div class="line"><span>  ${cart[bc]} × ${p.price.toFixed(2)}</span><span>${(cart[bc]*p.price).toFixed(2)} ₽</span></div>`;
    }).join("")}
    <div class="hr"></div>
    <div class="line total"><span>ИТОГО:</span><span>${total.toFixed(2)} ₽</span></div>
    <div class="line"><span>Оплата:</span><span>${method === "cash" ? "наличные" : "карта"}</span></div>
    ${extra}
    <div class="hr"></div>
    <div class="line"><span>Чек демо-режима (ККТ не подключена)</span></div>
    ${hasAlc ? '<div class="line"><span style="color:#d0021b">Продажа 18+ · возраст подтверждён</span></div>' : ""}
    <button onclick="closeTicket()">ЗАКРЫТЬ</button>`;

  document.getElementById("overlay").classList.add("show");

  shift.sales.push(sale);
  localStorage.setItem("shift", JSON.stringify(shift));
  document.getElementById("salesCount").textContent = shift.sales.length;
  cart = {};
  render();
}

function closeTicket() {
  document.getElementById("overlay").classList.remove("show");
  showMsg("✓ Чек пробит, сдача выдана — можно принимать следующего", "ok");
  document.getElementById("scan").focus();
}

function voidReceipt() { cart = {}; render(); showMsg("Чек отменён", "ok"); }

function toggleShift() {
  document.getElementById("shift").classList.toggle("open");
  document.getElementById("shiftRows").innerHTML = shift.sales.map(s =>
    `<tr><td>${s.n}</td><td>${s.time}</td><td>${s.total.toFixed(2)} ₽</td><td>${s.method === "cash" ? "нал." : "карта"}</td></tr>`).join("");
  const cash = shift.sales.filter(s => s.method === "cash").reduce((a, b) => a + b.total, 0);
  const card = shift.sales.filter(s => s.method === "card").reduce((a, b) => a + b.total, 0);
  document.getElementById("shiftTotals").innerHTML =
    `Чеков: <b>${shift.sales.length}</b><br>Наличные: <b>${cash.toFixed(2)} ₽</b><br>Карта: <b>${card.toFixed(2)} ₽</b><br>Итого: <b>${(cash + card).toFixed(2)} ₽</b>`;
}

if (!shift.start) { shift.start = new Date().toLocaleString("ru-RU"); localStorage.setItem("shift", JSON.stringify(shift)); }
document.getElementById("shiftStart").textContent = shift.start;
document.getElementById("salesCount").textContent = shift.sales.length;
render();
document.getElementById("scan").focus();
</script>
</body>
</html>
