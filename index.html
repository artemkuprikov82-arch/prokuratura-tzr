<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АИС Надзор | Прокуратура Тракторозаводского района</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; }
  .box { max-width: 1050px; margin: 20px auto; padding: 0 15px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 18px; }
  h2, h3 { color: #eab308; margin-top: 0; }
  input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 5px; margin: 6px 0 14px; font-size: 14px; }
  .btn { background: #eab308; color: #000; border: none; padding: 11px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #ca8a04; }
  .btn-blue { background: #3b82f6; color: #fff; }
  .btn-gray { background: #334155; color: #fff; }
  .btn-red { background: #dc2626; color: #fff; padding: 5px 10px; font-size: 12px; }
  .nav { background: #1e293b; padding: 10px 15px; border-bottom: 2px solid #eab308; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: #0f172a; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .tab.active { background: #eab308; color: #000; border-color: #eab308; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #334155; padding: 9px; text-align: left; }
  th { background: #0f172a; color: #eab308; }
  .status-select { margin: 0; padding: 6px; font-weight: bold; border-radius: 4px; cursor: pointer; }
  .add-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; background: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 18px; }
  .add-grid input, .add-grid select { margin: 4px 0 0; }
</style>
<script>
var defaultCases = [
  { num: "УД-014", target: "Лейтенант МВД Петров А.С.", law: "ст. 286 УК", resp: "Зинченко А.А.", status: "Выдан ордер" },
  { num: "ПРОВ-008", target: "Отдел полиции ТЗР", law: "Проверка УПК", resp: "Зинченко Е.В.", status: "В работе" },
  { num: "УД-011", target: "Гражданин Сидоров В.К.", law: "ст. 291 УК", resp: "Зинченко А.А.", status: "Передано в суд" }
];

function getCases() {
  var saved = localStorage.getItem('prok_cases_v1');
  if (saved) {
    return JSON.parse(saved);
  }
  localStorage.setItem('prok_cases_v1', JSON.stringify(defaultCases));
  return defaultCases;
}

function saveCases(list) {
  localStorage.setItem('prok_cases_v1', JSON.stringify(list));
  renderTable();
}

function getStatusColor(st) {
  if (st === "Выдан ордер") return "#ef4444";
  if (st === "В работе") return "#eab308";
  if (st === "Передано в суд") return "#3b82f6";
  return "#22c55e";
}

function renderTable() {
  var list = getCases();
  var tbody = document.getElementById('casesBody');
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    var col = getStatusColor(c.status);
    html += "<tr>";
    html += "<td><strong>" + c.num + "</strong></td>";
    html += "<td>" + c.target + "</td>";
    html += "<td>" + c.law + "</td>";
    html += "<td>" + c.resp + "</td>";
    html += "<td><select class='status-select' style='color:" + col + "; border-color:" + col + ";' onchange='changeStatus(" + i + ", this.value)'>";
    var opts = ["В работе", "Выдан ордер", "Передано в суд", "Исполнено / Закрыто"];
    for (var j = 0; j < opts.length; j++) {
      var sel = (c.status === opts[j]) ? "selected" : "";
      html += "<option value='" + opts[j] + "' " + sel + " style='color:#fff; background:#0f172a;'>" + opts[j] + "</option>";
    }
    html += "</select></td>";
    html += "<td style='text-align:center;'><button type='button' class='btn btn-red' onclick='delCase(" + i + ")'>✕</button></td>";
    html += "</tr>";
  }
  tbody.innerHTML = html;
}

function changeStatus(idx, newSt) {
  var list = getCases();
  list[idx].status = newSt;
  saveCases(list);
}

function delCase(idx) {
  var list = getCases();
  list.splice(idx, 1);
  saveCases(list);
}

function addManualCase() {
  var num = document.getElementById('mNum').value.trim() || "ДЕЛО-" + Math.floor(100 + Math.random() * 900);
  var target = document.getElementById('mTarget').value.trim() || "Не указан";
  var law = document.getElementById('mLaw').value.trim() || "Не указана";
  var resp = document.getElementById('mResp').value;
  var st = document.getElementById('mStatus').value;

  var list = getCases();
  list.unshift({ num: num, target: target, law: law, resp: resp, status: st });
  saveCases(list);

  document.getElementById('mNum').value = "";
  document.getElementById('mTarget').value = "";
  document.getElementById('mLaw').value = "";
}

function checkAuth() {
  var p = document.getElementById('uPass').value;
  var n = document.getElementById('uName').value;
  if (p === '7400') {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('appBox').style.display = 'block';
    document.getElementById('userTitle').innerText = n || 'Прокурор';
    renderTable();
  } else {
    document.getElementById('errText').style.display = 'block';
  }
}

function goTab(num, btn) {
  document.getElementById('p1').style.display = 'none';
  document.getElementById('p2').style.display = 'none';
  document.getElementById('p3').style.display = 'none';
  document.getElementById('p4').style.display = 'none';
  document.getElementById('p' + num).style.display = 'block';

  document.getElementById('b1').className = 'tab';
  document.getElementById('b2').className = 'tab';
  document.getElementById('b3').className = 'tab';
  document.getElementById('b4').className = 'tab';
  btn.className = 'tab active';
  if (num === 2) renderTable();
}

function genBlank() {
  var t = document.getElementById('dType').value;
  var n = document.getElementById('dNum').value.trim() || "№ 74-01/2026";
  var trg = document.getElementById('dTarget').value.trim() || '[Не указано]';
  var l = document.getElementById('dLaw').value.trim() || '[Не указано]';
  var txt = document.getElementById('dText').value.trim() || '[Не указано]';
  var s = document.getElementById('dSign').value;
  var shortResp = s.indexOf("Елизавета") > -1 ? "Зинченко Е.В." : "Зинченко А.А.";
  var startStatus = (t.indexOf("ОРДЕР") > -1) ? "Выдан ордер" : "В работе";

  var res = "ПРОКУРАТУРА ТРАКТОРОЗАВОДСКОГО РАЙОНА\n";
  res += "Адрес: ул. Белостоцкого, 11 | Тел.: +7 (993) 935-53-78\n";
  res += "--------------------------------------------------\n";
  res += t + " " + n + "\n";
  res += "В отношении: " + trg + "\n";
  res += "Основание: " + l + "\n\n";
  res += "СУТЬ:\n" + txt + "\n\n";
  res += s + "\n";
  res += "Подпись: ____________ / М.П. /";

  document.getElementById('blankOut').value = res;
  document.getElementById('blankCard').style.display = 'block';
  document.getElementById('okCopy').style.display = 'none';

  // Автоматическое добавление в реестр дел
  var list = getCases();
  list.unshift({ num: n, target: trg, law: l, resp: shortResp, status: startStatus });
  saveCases(list);
}

function copyDocText() {
  var area = document.getElementById('blankOut');
  area.select();
  document.execCommand('copy');
  document.getElementById('okCopy').style.display = 'inline';
}
</script>
</head>
<body>

<div id="loginBox" style="max-width:400px; margin:60px auto; padding:25px; background:#1e293b; border:1px solid #334155; border-top:4px solid #eab308; border-radius:8px; text-align:center;">
  <h2>⚖️ АИС «Надзор»</h2>
  <p style="color:#94a3b8; font-size:13px;">Прокуратура Тракторозаводского района<br>ул. Белостоцкого, д. 11</p>
  <input type="text" id="uName" placeholder="Ваша фамилия (напр. Зинченко А.А.)">
  <input type="password" id="uPass" placeholder="Код доступа (введите: 7400)" onkeydown="if(event.key==='Enter') checkAuth()">
  <button type="button" class="btn" style="width:100%;" onclick="checkAuth()">Войти в систему</button>
  <p id="errText" style="color:#ef4444; display:none; margin-bottom:0;">Неверный код! Введите 7400.</p>
</div>

<div id="appBox" style="display:none;">
  <div class="nav">
    <div class="tabs">
      <button type="button" class="tab active" id="b1" onclick="goTab(1, this)">📄 Создать документ</button>
      <button type="button" class="tab" id="b2" onclick="goTab(2, this)">🗂️ Реестр дел</button>
      <button type="button" class="tab" id="b3" onclick="goTab(3, this)">📖 Памятка УК</button>
      <button type="button" class="tab" id="b4" onclick="goTab(4, this)">👥 Руководство</button>
    </div>
    <div>
      <span style="font-size:13px; margin-right:10px;">👤 <strong id="userTitle">Прокурор</strong></span>
      <button type="button" class="btn btn-gray" style="padding:6px 12px; font-size:12px;" onclick="location.reload()">Выход</button>
    </div>
  </div>

  <div class="box">
    <!-- ВКЛАДКА 1: СОЗДАНИЕ ЗАЯВЛЕНИЯ И АВТОДОБАВЛЕНИЕ В РЕЕСТР -->
    <div id="p1" style="display:block;">
      <div class="card">
        <h3>Создание заявления или постановления</h3>
        <p style="font-size:13px; color:#94a3b8; margin-top:-8px;">После нажатия «Сформировать бланк» документ автоматически попадёт в «Реестр дел».</p>
        <label>Тип документа:</label>
        <select id="dType">
          <option value="ЗАЯВЛЕНИЕ В ПРОКУРАТУРУ">Заявление в прокуратуру</option>
          <option value="ПОСТАНОВЛЕНИЕ о возбуждении дела">Постановление о возбуждении уголовного дела</option>
          <option value="ОРДЕР на арест и обыск">Ордер на задержание и обыск</option>
          <option value="ПОСТАНОВЛЕНИЕ о проверке">Постановление о прокурорской проверке</option>
        </select>
