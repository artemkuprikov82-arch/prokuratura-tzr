<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АИС «Надзор» | Прокуратура Тракторозаводского района</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --gold: #eab308; --blue: #3b82f6; --green: #22c55e; --red: #ef4444; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }

        #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #090d16; }
        .login-box { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--gold); padding: 30px; border-radius: 8px; max-width: 400px; width: 100%; text-align: center; }
        .login-box h2 { margin: 10px 0 5px; font-size: 20px; text-transform: uppercase; color: var(--gold); }
        .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

        #mainApp { display: none; }

        header { background: #0b1120; border-bottom: 2px solid var(--gold); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .brand h1 { margin: 0; font-size: 17px; text-transform: uppercase; }
        .brand span { font-size: 12px; color: var(--muted); display: block; }
        .user-badge { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }

        nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 25px; display: flex; gap: 5px; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: var(--muted); padding: 14px 18px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

        .container { max-width: 1100px; margin: 25px auto; padding: 0 20px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 22px; margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: var(--gold); font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 5px; margin-bottom: 15px; font-family: inherit; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        .btn { background: var(--gold); color: #000; border: none; padding: 11px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #ca8a04; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-blue:hover { background: #2563eb; }
        .btn-sm { padding: 5px 10px; font-size: 12px; background: #334155; color: #fff; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid var(--border); padding: 11px; text-align: left; }
        th { background: #0f172a; color: var(--gold); }
        .tag { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .tag-work { background: rgba(234, 179, 8, 0.2); color: var(--gold); }
        .tag-ok { background: rgba(34, 197, 94, 0.2); color: var(--green); }
        .tag-warn { background: rgba(239, 68, 68, 0.2); color: var(--red); }

        #resultCard { display: none; }
        .doc-output { width: 100%; min-height: 260px; background: #0f172a; border: 1px dashed var(--gold); padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #e2e8f0; resize: vertical; }
        .copy-status { color: var(--green); font-size: 13px; font-weight: bold; margin-left: 10px; display: none; }

        footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; border-top: 1px solid var(--border); margin-top: 30px; }
    </style>
    <script>
        function enterPortal() {
            var name = document.getElementById("empName").value.trim();
            var pass = document.getElementById("empPass").value.trim();
            if (pass === "7400") {
                document.getElementById("currentUser").innerText = name || "Дежурный прокурор";
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                document.getElementById("loginErr").style.display = "none";
            } else {
                document.getElementById("loginErr").style.display = "block";
            }
        }

        function exitPortal() {
            document.getElementById("empPass").value = "";
            document.getElementById("mainApp").style.display = "none";
            document.getElementById("loginScreen").style.display = "flex";
        }

        function switchPage(pageId, btn) {
            var sections = document.getElementsByClassName("section");
            for (var i = 0; i < sections.length; i++) {
                sections[i].className = "section";
            }
            var btns = document.getElementsByClassName("tab-btn");
            for (var j = 0; j < btns.length; j++) {
                btns[j].className = "tab-btn";
            }
            document.getElementById(pageId).className = "section active";
            btn.className = "tab-btn active";
        }

        function createBlank() {
            var type = document.getElementById("docType").value;
            var num = document.getElementById("docNum").value;
            var target = document.getElementById("docTarget").value || "[Указать ФИО и должность]";
            var law = document.getElementById("docLaw").value || "[Указать статью]";
            var reason = document.getElementById("docReason").value || "[Описать обстоятельства]";
            var signer = document.getElementById("docSigner").value;
            var date = new Date().toLocaleDateString("ru-RU");

            var text = "====================================================\n" +
                       "ПРОКУРАТУРА ТРАКТОРОЗАВОДСКОГО РАЙОНА\n" +
                       "Адрес: ул. Белостоцкого, д. 11 | Тел.: +7 (993) 935-53-78\n" +
                       "====================================================\n\n" +
                       type.toUpperCase() + "\n" +
                       "Документ " + num + " от " + date + " г.\n\n" +
                       "В отношении: " + target + "\n" +
                       "Основание: " + law + "\n\n" +
                       "СУТЬ ОБРАЩЕНИЯ / ПОСТАНОВЛЕНИЯ:\n" +
                       reason + "\n\n" +
                       signer + "\n" +
                       "Подпись: _______________ / М.П. /";

            document.getElementById("docPreview").value = text;
            document.getElementById("resultCard").style.display = "block";
            document.getElementById("copyStatus").style.display = "none";
        }

        function copyBlank() {
            var area = document.getElementById("docPreview");
            area.select();
            area.setSelectionRange(0, 99999);
            document.execCommand("copy");
            document.getElementById("copyStatus").style.display = "inline";
        }

        function filterTable() {
            var filter = document.getElementById("caseSearch").value.toLowerCase();
            var rows = document.getElementById("casesTable").getElementsByTagName("tr");
            for (var i = 1; i < rows.length; i++) {
                var txt = rows[i].innerText.toLowerCase();
                rows[i].style.display = txt.indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <div style="font-size: 34px;">⚖️</div>
        <h2>АИС «Надзор»</h2>
        <p>Прокуратура Тракторозаводского района (ул. Белостоцкого, 11)</p>
        <input type="text" id="empName" placeholder="Ваша фамилия (напр. Зинченко А.А.)">
        <input type="password" id="empPass" placeholder="Код доступа (введите: 7400)" onkeyup="if(event.keyCode===13) enterPortal()">
        <button type="button" class="btn" style="width:100%;" onclick="enterPortal()">Войти в систему</button>
        <p id="loginErr" style="color: var(--red); display:none; margin-top:10px; margin-bottom:0;">Неверный код доступа! Введите 7400.</p>
    </div>
</div>

<div id="mainApp">
    <header>
        <div class="brand">
            <h1>⚖️ АИС «Надзор» — Прокуратура Тракторозаводского района</h1>
            <span>Служебный портал | Тел.: +7 (993) 935-53-78 / +7 (969) 445-53-78</span>
        </div>
        <div class="user-badge">
            <span>👤 Сотрудник: <strong id="currentUser">Прокурор</strong></span>
            <button type="button" class="btn btn-sm" onclick="exitPortal()">Выход</button>
        </div>
    </header>

    <nav>
        <button type="button" class="tab-btn active" onclick="switchPage('generator', this)">📄 Создать документ / заявление</button>
        <button type="button" class="tab-btn" onclick="switchPage('cases', this)">🗂️ Реестр дел и ордеров</button>
