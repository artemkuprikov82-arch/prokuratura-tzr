<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>POS-терминал · Рабочее место кассира</title>
<style>
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI", Arial, sans-serif; }
  body { height:100vh; display:flex; flex-direction:column; background:#14161b; color:#e8e8e8; overflow:hidden; }

  header { background:#a3000f; padding:8px 16px; display:flex; gap:24px; font-size:14px; }
  header b { letter-spacing:1px; }
  header .r { margin-left:auto; }

  main { flex:1; display:flex; min-height:0; }

  /* ЛЕВАЯ ЧАСТЬ — ЧЕК */
  #left { flex:1.3; display:flex; flex-direction:column; padding:12px; min-width:0; border-right:2px solid #2a2d35; }
  #scan { padding:12px; font-size:17px; border:0; border-radius:6px; outline:none; background:#fff; color:#000; }
  .hint { font-size:11px; color:#7a7f8a; margin:5px 0 10px; }
  #list { flex:1; overflow-y:auto; }
  .pos { background:#1e2129; border-left:4px solid #d0021b; border-radius:4px;
         padding:8px 10px; margin-bottom:6px; display:flex; align-items:center; gap:8px; font-size:14px; }
  .pos .n { flex:1; } .pos .s { width:26px; text-align:center; font-weight:bold; }
  .pos .c { color:#8a8f99; font-size:12px; width:40px; text-align:right; }
  .pos button { width:24px; height:24px; border:0; border-radius:3px; background:#2e323c;
                color:#fff; cursor:pointer; }
  .pos .x { background:none; color:#ff6b6b; font-size:14px; }
  #empty { color:#5c616b; text-align:center; margin-top:60px; font-size:14px; }

  /* ПРАВАЯ ЧАСТЬ — ПАНЕЛЬ ОПЕРАЦИЙ */
  #right { flex:1; padding:14px; display:flex; flex-direction:column; gap:10px; background:#191c22; }
  #display { background:#000; border:2px solid #2e323c; border-radius:6px; padding:14px; text-align:center; }
  #display .lbl { font-size:11px; color:#7a7f8a; letter-spacing:2px; }
  #display .val { font-size:38px; font-weight:bold; color:#4cd964; font-family:"Consolas", monospace; }
  #display .cnt { font-size:12px; color:#8a8f99; margin-top:4px; }

  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad button { padding:16px 0; font-size:18px; border:0; border-radius:6px;
                background:#242832; color:#fff; cursor:pointer; }
  .pad button:active { background:#2e323c; }
  .pad .c { color:#4cd964; }

  .ops { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ops button { padding:14px 0; border:0; border-radius:6px; color:#fff;
                font-weight:bold; font-size:14px; cursor:pointer; }
  .b-cash { background:#1e7e34; } .b-card { background:#155d9c; }
  .b-void { background:#3a3f4b; } .b-alc  { background:#6a4fd8; }

  #msg { text-align:center; font-size:13px; min-height:18px; }
  #msg.err { color:#ff6b6b; } #msg.ok { color:#4cd964; }

  .note { font-size:11px; color:#5c616b; text-align:center; margin-top:auto; }

  /* ОКНО ЧЕКА */
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; }
  #ov.show { display:block; }
  #tk { background:#fff; color:#000; width:300px; margin:30px auto; padding:18px;
        font-family:"Courier New", monospace; font-size:13px; }
  #tk h3 { text-align:center; margin-bottom:8px; font-size:15px; }
  #tk .l { display:flex; justify-content:space-between; margin:2px 0; }
  #tk .hr { border-top:1px dashed #888; margin:6px 0; }
  #tk .t { font-weight:bold; font-size:15px; }
  #tk button { width:100%; margin-top:10px; padding:9px; background:#a3000f; color:#fff;
               border:0; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <b>POS · КАССА №1</b>
  <span>Смена: Иванова А.</span>
  <span class="r" id="clock"></span>
</header>

<main>
  <div id="left">
    <input id="scan" placeholder="▼ СКАН ШТРИХКОДА + ENTER" autofocus autocomplete="off">
    <div class="hint">Тестовые коды: 111 пиво · 222 вино · 333 водка · 444 вода · 555 чипсы · 666 хлеб</div>
    <div id="list"></div>
    <div id="empty">── ЧЕК ПУСТ ──<br><br>Отсканируйте товар</div>
  </div>

  <div id="right">
    <div id="display">
      <div class="lbl">ИТОГО К ОПЛАТЕ</div>
      <div class="val" id="total">0.00</div>
      <div class="cnt" id="cnt">позиций: 0</div>
    </div>

    <div class="pad">
      <button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button>
      <button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button>
      <button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button>
      <button onclick="key('C')">C</button><button onclick="key('0')">0</button><button class="c" onclick="key('OK')">OK</button>
    </div>

    <div id="msg"></div>

    <div class="ops">
      <button class="b-cash" onclick="pay(1)">НАЛИЧНЫЕ</button>
      <button class="b-card" onclick="pay(2)">КАРТА</button>
      <button class="b-void" onclick="voidAll()">ОТМЕНА ЧЕКА</button>
      <button class="b-alc" onclick="askAge()">18+ ПОДТВЕРЖДЁН</button>
    </div>

    <div class="note">Режим: ОНЛАЙН · ККТ: демо (не подключена)</div>
  </div>
</main>

<div id="ov"><div id="tk"></div></div>

<script>
"use strict";

var PRODUCTS = {
  "111": { name:"Пиво светлое 0,5 л",       price:129, alc:true  },
  "222": { name:"Вино красное сухое 0,7 л", price:599, alc:true  },
  "333": { name:"Водка классическая 0,5 л", price:549, alc:true  },
  "444": { name:"Минеральная вода 0,5 л",   price:55             },
  "555": { name:"Чипсы 150 г",              price:99             },
  "666": { name:"Хлеб нарезной 400 г",      price:42             }
};

var cart = {};
var ageOK = false;

function say(t, c) {
  var m = document.getElementById("msg");
  m.textContent = t; m.className = c || "";
}
function timeAlc() { var h = new Date().getHours(); return h >= 23 || h < 8; }

function add(code) {
  var p = PRODUCTS[code];
  if (!p) { say("✕ ТОВАР НЕ НАЙДЕН: " + code, "err"); return; }
  if (p.alc && timeAlc()) { say("✕ АЛКОГОЛЬ: ЗАПРЕЩЕНО 23:00–08:00", "err"); return; }
  cart[code] = (cart[code] || 0) + 1;
  say("✓ " + p.name + " · " + p.price.toFixed(2) + " ₽", "ok");
  render();
}
function chg(code, d) { cart[code] += d; if (cart[code] <= 0) delete cart[code]; render(); }
function rm(code) { delete cart[code]; render(); }
function voidAll() { cart = {}; ageOK = false; say("ЧЕК ОТМЕНЁН", "ok"); render(); }
function askAge() { ageOK = true; say("✓ Возраст 18+ подтверждён", "ok"); }

function sum() { var s = 0, c; for (c in cart) s += PRODUCTS[c].price * cart[c]; return s; }

function render() {
  var h = "", c;
  for (c in cart) {
    var p = PRODUCTS[c];
    h += '<div class="pos">' +
      '<div class="n">' + p.name + (p.alc ? ' <span style="color:#ff6b6b">18+</span>' : "") + '</div>' +
      '<button onclick="chg(\'' + c + '\',-1)">−</button>' +
      '<div class="s">' + cart[c] + '</div>' +
      '<button onclick="chg(\'' + c + '\',1)">+</button>' +
      '<div class="c">' + (p.price * cart[c]).toFixed(2) + '</div>' +
      '<button class="x" onclick="rm(\'' + c + '\')">✕</button></div>';
  }
  document.getElementById("list").innerHTML = h;
  document.getElementById("empty").style.display = h ? "none" : "block";
  document.getElementById("total").textContent = sum().toFixed(2);
  var q = 0; for (c in cart) q += cart[c];
  document.getElementById("cnt").textContent = "позиций: " + q;
}

/* цифровая панель вводит код товара */
function key(k) {
  var f = document.getElementById("scan");
  if (k === "C") { f.value = ""; f.focus(); return; }
  if (k === "OK") { doScan(); return; }
  f.value += k; f.focus();
}
function doScan() {
  var f = document.getElementById("scan");
  var code = f.value.trim(); f.value = "";
  if (code) add(code); f.focus();
}
document.getElementById("scan").addEventListener("keydown", function (e) {
  if (e.key === "Enter") doScan();
});

function pay(method) {
  var codes = [], c; for (c in cart) codes.push(c);
  if (!codes.length) { say("✕ ЧЕК ПУСТ", "err"); return; }

  var hasAlc = false;
  for (var i = 0; i < codes.length; i++) if (PRODUCTS[codes[i]].alc) hasAlc = true;
  if (hasAlc && !ageOK) { say("✕ ПОДТВЕРДИТЕ 18+ (кнопка)", "err"); return; }
  if (hasAlc && timeAlc()) { say("✕ ВРЕМЯ ПРОДАЖИ АЛКОГОЛЯ ЗАПРЕЩЕНО", "err"); return; }

  var total = sum(), extra = "";
  if (method === 1) {
    var g = prompt("ВНЕСЕНО НАЛИЧНЫМИ, ₽:", Math.ceil(total));
    if (g === null) return;
    var v = parseFloat(String(g).replace(",", "."));
    if (isNaN(v) || v < total) { say("✕ НЕДОСТАТОЧНО НАЛИЧНЫХ", "err"); return; }
    extra = '<div class="l"><span>Внесено:</span><span>' + v.toFixed(2) + '</span></div>' +
            '<div class="l"><span>СДАЧА:</span><span><b>' + (v - total).toFixed(2) + '</b></span></div>';
  }

  var rows = "", j;
  for (j = 0; j < codes.length; j++) {
    var pp = PRODUCTS[codes[j]];
    rows += '<div class="l"><span>' + pp.name + '</span></div>' +
            '<div class="l"><span>&nbsp;&nbsp;' + cart[codes[j]] + '×' + pp.price.toFixed(2) +
            '</span><span>' + (pp.price * cart[codes[j]]).toFixed(2) + '</span></div>';
  }

  document.getElementById("tk").innerHTML =
    '<h3>★ ЧЕК ★<br>Магазин «КрасноБелое»</h3>' +
    '<div class="l"><span>' + new Date().toLocaleString("ru-RU") + '</span></div>' +
    '<div class="l"><span>Касса 1 · Иванова А.</span></div>' +
    '<div class="hr"></div>' + rows +
    '<div class="hr"></div>' +
    '<div class="l t"><span>ИТОГО:</span><span>' + total.toFixed(2) + ' ₽</span></div>' +
    '<div class="l"><span>Оплата:</span><span>' + (method === 1 ? "НАЛИЧНЫЕ" : "КАРТА") + '</span></div>' +
    extra +
    (hasAlc ? '<div class="l"><span>18+ · возраст подтверждён</span></div>' : "") +
    '<div class="hr"></div>' +
    '<div class="l"><span style="font-size:11px">ДЕМО-РЕЖИМ · ККТ НЕ ПОДКЛЮЧЕНА</span></div>' +
    '<button onclick="closeTk()">ЗАКРЫТЬ</button>';

  document.getElementById("ov").className = "show";
  cart = {}; ageOK = false; render();
}
function closeTk() {
  document.getElementById("ov").className = "";
  say("✓ ЧЕК ЗАКРЫТ · СЛЕДУЮЩИЙ ПОКУПАТЕЛЬ", "ok");
  document.getElementById("scan").focus();
}

setInterval(function () {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("ru-RU");
}, 1000);

render();
</script>
</body>
</html>
