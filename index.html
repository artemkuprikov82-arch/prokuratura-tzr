<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Касса — КрасноБелое (демо)</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #1e1f24; color: #eee; }
  header { background: #d0021b; padding: 12px 20px; font-weight: bold; font-size: 18px; }
  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  #scan { width: 100%; padding: 14px; font-size: 18px; border: 0; border-radius: 8px; }
  .hint { color: #888; font-size: 12px; margin: 6px 0 14px; }
  .item { background: #2a2b31; border-radius: 8px; padding: 10px; margin-bottom: 8px;
          display: flex; align-items: center; gap: 10px; }
  .item .name { flex: 1; }
  .item .sub { color: #999; font-size: 12px; }
  .item button { width: 28px; height: 28px; border: 0; background: #3a3b42; color: #fff;
                 border-radius: 4px; cursor: pointer; font-size: 16px; }
  .item .sum { width: 90px; text-align: right; font-weight: bold; }
  .item .del { background: none; color: #ff7b7b; font-size: 16px; }
  #empty { color: #777; text-align: center; margin-top: 40px; }

  #paybox { background: #26272d; border-radius: 10px; padding: 16px; margin-top: 16px; }
  #total { font-size: 32px; font-weight: bold; color: #7fd57f; text-align: center; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 8px; border: 0;
         border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  .cash { background: #1e8e3e; } .card { background: #1a5fb4; } .void { background: #444; }
  #msg { text-align: center; margin: 10px 0; min-height: 20px; }
  #msg.err { color: #ff7b7b; } #msg.ok { color: #7fd57f; }

  #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
             background: rgba(0,0,0,0.6); display: none; }
  #overlay.show { display: block; }
  #ticket { background: #fff; color: #000; width: 320px; margin: 40px auto;
            padding: 20px; font-family: "Courier New", monospace; font-size: 13px; }
  #ticket h3 { text-align: center; margin: 0 0 10px; }
  #ticket .line { display: flex; justify-content: space-between; margin: 3px 0; }
  #ticket .hr { border-top: 1px dashed #999; margin: 8px 0; }
  #ticket button { width: 100%; margin-top: 12px; padding: 10px; background: #d0021b;
                   color: #fff; border: 0; cursor: pointer; }
</style>
</head>
<body>

<header>КРАСНОБЕЛОЕ · КАССА №1</header>

<main>
  <input id="scan" placeholder="Введите штрихкод и нажмите Enter" autofocus>
  <div class="hint">Попробуйте коды: 111, 222, 333, 444, 555, 666</div>

  <div id="list"></div>
  <div id="empty">Чек пуст. Введите код товара.</div>

  <div id="paybox">
    <div id="total">0.00 ₽</div>
    <div id="msg"></div>
    <label style="font-size:14px"><input type="checkbox" id="age"> Покупателю 18+ подтверждён</label>
    <button class="btn cash" onclick="pay('cash')">НАЛИЧНЫЕ</button>
    <button class="btn card" onclick="pay('card')">КАРТА</button>
    <button class="btn void" onclick="clearAll()">ОТМЕНИТЬ ЧЕК</button>
  </div>
</main>

<div id="overlay" onclick="closeTicket()"><div id="ticket" onclick="event.stopPropagation()"></div></div>

<script>
"use strict";

var PRODUCTS = {
  "111": { name: "Пиво светлое 0,5 л",       price: 129, alc: true },
  "222": { name: "Вино красное сухое 0,7 л", price: 599, alc: true },
  "333": { name: "Водка классическая 0,5 л", price: 549, alc: true },
  "444": { name: "Минеральная вода 0,5 л",   price: 55  },
  "555": { name: "Чипсы 150 г",              price: 99  },
  "666": { name: "Хлеб нарезной 400 г",      price: 42  }
};

var cart = {};

function alcoholForbidden() {
  var h = new Date().getHours();
  return h >= 23 || h < 8;
}

function say(text, cls) {
  var m = document.getElementById("msg");
  m.textContent = text;
  m.className = cls || "";
}

function add(code) {
  var p = PRODUCTS[code];
  if (!p) { say("Товар не найден: " + code, "err"); return; }
  if (p.alc && alcoholForbidden()) {
    say("Алкоголь: продажа запрещена с 23:00 до 08:00", "err");
    return;
  }
  cart[code] = (cart[code] || 0) + 1;
  say("Добавлено: " + p.name, "ok");
  render();
}

function qty(code, delta) {
  cart[code] = cart[code] + delta;
  if (cart[code] <= 0) delete cart[code];
  render();
}

function remove(code) {
  delete cart[code];
  render();
}

function clearAll() {
  cart = {};
  say("Чек отменён", "ok");
  render();
}

function totalSum() {
  var s = 0, c;
  for (c in cart) s += PRODUCTS[c].price * cart[c];
  return s;
}

function render() {
  var html = "", code, p;
  for (code in cart) {
    p = PRODUCTS[code];
    html += '<div class="item">' +
      '<div class="name">' + p.name +
        '<div class="sub">' + (p.alc ? "18+ · " : "") + p.price + " ₽/шт · код " + code + '</div></div>' +
      '<button onclick="qty(\'' + code + '\',-1)">−</button>' +
      '<b>' + cart[code] + '</b>' +
      '<button onclick="qty(\'' + code + '\',1)">+</button>' +
      '<div class="sum">' + (p.price * cart[code]).toFixed(2) + ' ₽</div>' +
      '<button class="del" onclick="remove(\'' + code + '\')">✕</button>' +
    '</div>';
  }
  document.getElementById("list").innerHTML = html;
  document.getElementById("empty").style.display = html ? "none" : "block";
  document.getElementById("total").textContent = totalSum().toFixed(2) + " ₽";
}

function pay(method) {
  var codes = [], c;
  for (c in cart) codes.push(c);
  if (codes.length === 0) { say("Чек пуст", "err"); return; }

  var hasAlc = false;
  for (var i = 0; i < codes.length; i++) if (PRODUCTS[codes[i]].alc) hasAlc = true;

  if (hasAlc && !document.getElementById("age").checked) {
    say("Подтвердите возраст покупателя (18+)", "err");
    return;
  }
  if (hasAlc && alcoholForbidden()) {
    say("Алкоголь: продажа запрещена с 23:00 до 08:00", "err");
    return;
  }

  var total = totalSum();
  var changeLine = "";

  if (method === "cash") {
    var given = prompt("Сумма от покупателя, ₽:", Math.ceil(total));
    if (given === null) return;
    var g = parseFloat(given.replace(",", "."));
    if (isNaN(g) || g < total) { say("Недостаточно наличных", "err"); return; }
    changeLine = '<div class="line"><span>Внесено:</span><span>' + g.toFixed(2) + ' ₽</span></div>' +
      '<div class="line"><b>СДАЧА:</b><span>' + (g - total).toFixed(2) + ' ₽</span></div>';
  }

  var rows = "", j, pi;
  for (j = 0; j < codes.length; j++) {
    pi = PRODUCTS[codes[j]];
    rows += '<div class="line"><span>' + pi.name + '</span></div>' +
            '<div class="line"><span>&nbsp;&nbsp;' + cart[codes[j]] + ' × ' + pi.price.toFixed(2) +
            '</span><span>' + (pi.price * cart[codes[j]]).toFixed(2) + ' ₽</span></div>';
  }

  document.getElementById("ticket").innerHTML =
    '<h3>ЧЕК</h3>' +
    '<div class="line"><span>Магазин «КрасноБелое» (демо)</span></div>' +
    '<div class="line"><span>' + new Date().toLocaleString("ru-RU") + '</span></div>' +
    '<div class="hr"></div>' + rows +
    '<div class="hr"></div>' +
    '<div class="line"><b>ИТОГО:</b><b>' + total.toFixed(2) + ' ₽</b></div>' +
    '<div class="line"><span>Оплата:</span><span>' + (method === "cash" ? "наличные" : "карта") + '</span></div>' +
    changeLine +
    (hasAlc ? '<div class="line"><span>Продажа 18+, возраст подтверждён</span></div>' : "") +
    '<button onclick="closeTicket()">ЗАКРЫТЬ</button>';

  document.getElementById("overlay").className = "show";
  cart = {};
  render();
  document.getElementById("age").checked = false;
}

function closeTicket() {
  document.getElementById("overlay").className = "";
  say("Чек пробит", "ok");
  document.getElementById("scan").focus();
}

document.getElementById("scan").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    var code = this.value.trim();
    this.value = "";
    if (code !== "") add(code);
  }
});

render();
</script>
</body>
</html>
